# Common
random_seed: 42
lr: 0.0001
weight_decay: 0.0001

model_type: 'Pytorch'
model:
  _target_: models.HatefulMemesFusionModel
  text_hidden_dim: 768
  image_output_dim: 256
  fusion_output_dim: 256
  output_size: 2

dataset:
  name: 'hateful_memes'
  validation_split: 0.2

# Client
task_id: 'fedmapxx'

wandb:
  use: false
  key: 'your-wandb-key'
  account: 'your-wandb-account'
  project: '${dataset.name}_${task_id}'

# FL setup
num_epochs: 1
batch_size: 8
num_rounds: 2
clients_per_round: 2

fedprox_mu: 0.05
focal_gamma: 2.0

server:
  strategy:
    _target_: fedmap.strategy.ModalityAwareAggregation
    aggregator_path: "aggregator_mlp.pth"   # load/save in root (same as your original)
    input_dim: 10
    hidden_dim: 16
    aggregator_lr: 0.001
    entropy_coeff: 0.01
    n_trials_per_round: 6
    perf_mix_lambda: 0.7
    z_clip: 3.0

    # Flower FedOps compatibility keys (not used by strategy but preserved)
    fraction_fit: 0.00001
    fraction_evaluate: 0.000001
    min_fit_clients: ${clients_per_round}
    min_available_clients: ${clients_per_round}
    min_evaluate_clients: ${clients_per_round}
